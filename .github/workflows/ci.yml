name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The commit hook is for a working tree; install must not try to register it here.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the packageManager field, so the pin has one owner.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:ci
